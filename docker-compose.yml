version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pmi_postgres
    restart: always
    environment:
      POSTGRES_USER: pmi_user
      POSTGRES_PASSWORD: pmi_password
      POSTGRES_DB: pmi_floorplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmi_user -d pmi_floorplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmi_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pmi_user:pmi_password@postgres:5432/pmi_floorplan?schema=public
      JWT_SECRET: pmi_super_secret_jwt_key_2026_change_in_prod
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pmi_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
